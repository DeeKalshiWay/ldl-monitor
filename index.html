function escapeHTML(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function sourceClass(src) {
  if (src === 'sam.gov') return 'sam';
  if (src === 'usaspending.gov') return 'usaspending';
  if (src === 'sec_edgar') return 'sec';
  return '';
}

function scoreClass(s) {
  if (s >= 75) return 'hi';
  if (s >= 50) return 'mid';
  return 'lo';
}

const state = { sortKey: 'score', sortDir: 'desc', search: '', source: '', minScore: 0, unsentOnly: false, visible: [] };

function render() {
  let rows = LEADS.filter(l => {
    if (state.source && l.source !== state.source) return false;
    if (l.score < state.minScore) return false;
    if (state.unsentOnly && l.sent_in_digest) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      const blob = `${l.title} ${l.organization} ${l.description}`.toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });

  rows.sort((a, b) => {
    const av = a[state.sortKey] ?? '';
    const bv = b[state.sortKey] ?? '';
    if (typeof av === 'number' && typeof bv === 'number') return state.sortDir === 'asc' ? av - bv : bv - av;
    return state.sortDir === 'asc'
      ? String(av).localeCompare(String(bv))
      : String(bv).localeCompare(String(av));
  });

  state.visible = rows;
  document.getElementById('stat-total').textContent = LEADS.length;
  document.getElementById('stat-new').textContent = LEADS.filter(l => !l.sent_in_digest).length;
  document.getElementById('stat-hi').textContent = LEADS.filter(l => l.score >= 75).length;
  document.getElementById('stat-gov').textContent = LEADS.filter(l => l.source === 'sam.gov').length;

  const body = document.getElementById('leads-body');
  if (rows.length === 0) {
    body.innerHTML = '<tr><td colspan="5" class="empty">No leads match these filters.</td></tr>';
    return;
  }
  body.innerHTML = rows.map(l => `
    <tr>
      <td><span class="score ${scoreClass(l.score)}">${l.score}</span></td>
      <td><span class="source ${sourceClass(l.source)}">${escapeHTML(l.source)}</span></td>
      <td class="title-cell">
        <a href="${escapeHTML(l.url)}" target="_blank">${escapeHTML(l.title)}</a>
        ${!l.sent_in_digest ? '<span class="new-badge">new</span>' : ''}
        ${l.description ? `<div class="desc">${escapeHTML(l.description.slice(0, 200))}${l.description.length > 200 ? '…' : ''}</div>` : ''}
        ${l.matched_keywords ? `<div class="matched">matched: ${escapeHTML(l.matched_keywords)}</div>` : ''}
      </td>
      <td class="org">${escapeHTML(l.organization)}</td>
      <td class="date">${escapeHTML(l.deadline || l.posted_date || '').slice(0, 10)}</td>
    </tr>
  `).join('');

  document.querySelectorAll('th').forEach(th => {
    th.classList.toggle('sort-active', th.dataset.sort === state.sortKey);
    const arrow = th.querySelector('.arrow');
    if (th.dataset.sort === state.sortKey) arrow.textContent = state.sortDir === 'asc' ? '↑' : '↓';
    else arrow.textContent = '↕';
  });
}

document.querySelectorAll('th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    else { state.sortKey = key; state.sortDir = key === 'score' ? 'desc' : 'asc'; }
    render();
  });
});
document.getElementById('search').addEventListener('input', e => { state.search = e.target.value; render(); });
document.getElementById('filter-source').addEventListener('change', e => { state.source = e.target.value; render(); });
document.getElementById('filter-score').addEventListener('change', e => { state.minScore = +e.target.value; render(); });
document.getElementById('filter-unsent').addEventListener('change', e => { state.unsentOnly = e.target.checked; render(); });

document.getElementById('export-csv').addEventListener('click', () => {
  const cols = ['score','source','title','url','organization','posted_date','deadline','description','matched_keywords','sent_in_digest'];
  const csvCell = v => {
    const s = (v == null) ? '' : String(v).replace(/\r?\n/g, ' ');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const lines = [cols.join(',')];
  for (const r of state.visible) lines.push(cols.map(c => csvCell(r[c])).join(','));
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ldl_leads_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

render();
</script>
